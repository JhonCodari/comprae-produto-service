version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: comprae-postgres
    environment:
      POSTGRES_DB: comprae_produtos
      POSTGRES_USER: comprae_user
      POSTGRES_PASSWORD: comprae_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - comprae-network

  produto-service:
    build: .
    container_name: comprae-produto-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/comprae_produtos
      SPRING_DATASOURCE_USERNAME: comprae_user
      SPRING_DATASOURCE_PASSWORD: comprae_pass
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - comprae-network

volumes:
  postgres_data:

networks:
  comprae-network:
    driver: bridge
