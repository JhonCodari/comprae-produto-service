# Configurações da Aplicação
spring.application.name=comprae-produto-service
server.port=8082

# Incluir configurações do cliente de configuração baseadas no profile
spring.config.import=optional:classpath:application-config.properties,optional:classpath:application-config-${spring.profiles.active:dev}.properties

# Configurações do Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/comprae_produtos
spring.datasource.username=comprae_user
spring.datasource.password=comprae_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Configurações de Validação
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# Configurações de Logging
logging.level.br.com.comprae=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configurações do Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Configurações do Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Informações da aplicação
info.app.name=Compraê Produto Service
info.app.description=Microserviço de Produtos do Ecosistema Compraê
info.app.version=1.0.0
info.app.team=Equipe Compraê

# Configurações de Performance
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Configurações de Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Configurações do Redis (Cache Distribuído)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Configurações de Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=5m,recordStats

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.produto-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.produto-service.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.produto-service.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.produto-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.produto-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.produto-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.produto-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.produto-service.automatic-transition-from-open-to-half-open-enabled=true

# Resilience4j Retry
resilience4j.retry.instances.produto-service.max-attempts=3
resilience4j.retry.instances.produto-service.wait-duration=500ms
resilience4j.retry.instances.produto-service.enable-exponential-backoff=true
resilience4j.retry.instances.produto-service.exponential-backoff-multiplier=2

# Resilience4j Bulkhead
resilience4j.bulkhead.instances.produto-service.max-concurrent-calls=20
resilience4j.bulkhead.instances.produto-service.max-wait-duration=100ms

# Resilience4j Rate Limiter
resilience4j.ratelimiter.instances.produto-service.limit-for-period=100
resilience4j.ratelimiter.instances.produto-service.limit-refresh-period=1s
resilience4j.ratelimiter.instances.produto-service.timeout-duration=200ms

# OpenTelemetry Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Configurações de Async
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=1000
spring.task.execution.thread-name-prefix=produto-async-

# Configurações de Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
