# Configurações da Aplicação
spring.application.name=comprae-produto-service
server.port=8082

# Incluir configurações do cliente de configuração baseadas no profile
spring.config.import=optional:classpath:application-config.properties,optional:classpath:application-config-${spring.profiles.active:dev}.properties

# Configurações do Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/comprae_produtos
spring.datasource.username=comprae_user
spring.datasource.password=comprae_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Configurações de Validação
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# Configurações de Logging
logging.level.br.com.comprae=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configurações do Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Configurações do Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Informações da aplicação
info.app.name=Compraê Produto Service
info.app.description=Microserviço de Produtos do Ecosistema Compraê
info.app.version=1.0.0
info.app.team=Equipe Compraê

# Configurações de Performance
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Configurações de Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
