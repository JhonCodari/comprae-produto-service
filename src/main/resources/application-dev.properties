# Configurações para ambiente de desenvolvimento
spring.profiles.active=dev

# Configurações do Banco H2 para desenvolvimento
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate para desenvolvimento
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging mais detalhado para desenvolvimento
logging.level.br.com.comprae=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.io.github.resilience4j=DEBUG
logging.level.org.springframework.cache=DEBUG

# Redis para desenvolvimento (local)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Configurações de observabilidade para desenvolvimento
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Resilience4j com valores mais permissivos para desenvolvimento
resilience4j.circuitbreaker.instances.produto-service.failure-rate-threshold=70
resilience4j.circuitbreaker.instances.produto-service.wait-duration-in-open-state=10s
resilience4j.retry.instances.produto-service.max-attempts=2
resilience4j.bulkhead.instances.produto-service.max-concurrent-calls=50
resilience4j.ratelimiter.instances.produto-service.limit-for-period=200
