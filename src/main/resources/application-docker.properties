# Configurações para ambiente Docker

# Configurações do Banco PostgreSQL no Docker
spring.datasource.url=jdbc:postgresql://postgres-produto:5432/comprae_produtos
spring.datasource.username=admin
spring.datasource.password=admin123

# Configurações do Redis no Docker  
spring.data.redis.host=comprae-redis
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Configurações do Kafka no Docker
spring.kafka.bootstrap-servers=config-server-kafka:9092
spring.kafka.consumer.group-id=produto-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# JPA/Hibernate para produção
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging para produção
logging.level.br.com.comprae=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Configurações do Config Server para Docker
config.client.server-url=http://comprae-config-server:8080
config.client.environment=docker
# Configurações do Kafka para notificações
config.client.kafka.enabled=true
config.client.kafka.bootstrap-servers=config-server-kafka:9092
config.client.kafka.topic=config-changes

# Configurações de observabilidade para Docker
management.tracing.sampling.probability=0.1
management.zipkin.tracing.endpoint=http://comprae-zipkin:9411/api/v2/spans

# Resilience4j para ambiente Docker (produção)
resilience4j.circuitbreaker.instances.produto-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.produto-service.wait-duration-in-open-state=30s
resilience4j.retry.instances.produto-service.max-attempts=3
resilience4j.bulkhead.instances.produto-service.max-concurrent-calls=20
resilience4j.ratelimiter.instances.produto-service.limit-for-period=100

# Connection Pool otimizado para Docker
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Cache distribuído para Docker
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000

# Configurações do Actuator para Docker
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET,POST
management.endpoint.prometheus.access=UNRESTRICTED
management.prometheus.metrics.export.enabled=true
